<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <!-- AUTOMATIC CACHE DISABLE FOR MOBILE APPS -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>BONK Tap & Admin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --gold: #f3ba2f;
            --gold-gradient: linear-gradient(135deg, #f3ba2f 0%, #f1a80a 100%);
            --text-color: #ffffff;
            --text-muted: #c5c6c7;
            --border-color: #2c3540;
            --green: #28a745;
            --red: #dc3545;
            --blue: #0088cc;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            flex: 1;
            padding: 20px;
            margin-bottom: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .balance-header {
            text-align: center;
            margin-top: 10px;
        }

        .balance-title {
            font-size: 14px;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .balance-amount {
            font-size: 42px;
            font-weight: 800;
            color: var(--gold);
            margin: 5px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .tap-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin: 20px 0;
        }

        .coin-btn {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, #2b2b2b 0%, #111111 100%);
            border: 4px solid var(--gold);
            box-shadow: 0 0 30px rgba(243, 186, 47, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.05s ease;
        }

        .coin-btn:active {
            transform: scale(0.95);
        }

        .coin-img {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            pointer-events: none;
        }

        .energy-box {
            width: 100%;
            max-width: 320px;
            text-align: center;
            margin-bottom: 15px;
        }

        .energy-text {
            font-size: 16px;
            font-weight: bold;
            color: var(--gold);
            margin-bottom: 8px;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: #1e2022;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .progress-fill {
            height: 100%;
            width: 100%;
            background: var(--gold-gradient);
            transition: width 0.2s;
        }

        .btn {
            width: 100%;
            max-width: 320px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            background: var(--gold-gradient);
            color: #000;
            box-shadow: 0 4px 15px rgba(243, 186, 47, 0.2);
            margin-top: 10px;
        }

        .btn:disabled {
            background: #2c3540 !important;
            color: #6c757d !important;
            box-shadow: none;
            cursor: not-allowed;
        }

        .btn-sm {
            padding: 8px 14px;
            font-size: 13px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            color: #fff;
        }

        .btn-start { background: var(--blue); }
        .btn-approve { background: var(--green); }
        .btn-reject { background: var(--red); }
        .btn-done { background: #2c3540; color: #6c757d; cursor: not-allowed; }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            font-size: 12px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 14px;
            background: #111418;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: var(--gold);
        }

        .navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #121418;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 999;
        }

        .nav-item {
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }

        .nav-item.active {
            color: var(--gold);
        }

        .screen { display: none; width: 100%; }
        .screen.active { display: flex; flex-direction: column; align-items: center; }

        .admin-table {
            width: 100%;
            max-width: 500px;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 13px;
        }
