<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BONK Tap & Admin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --gold: #f3ba2f;
            --gold-gradient: linear-gradient(135deg, #f3ba2f 0%, #f1a80a 100%);
            --text-color: #ffffff;
            --text-muted: #c5c6c7;
            --border-color: #2c3540;
            --green: #28a745;
            --red: #dc3545;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            flex: 1;
            padding: 20px;
            margin-bottom: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .balance-header {
            text-align: center;
            margin-top: 10px;
        }

        .balance-title {
            font-size: 14px;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .balance-amount {
            font-size: 42px;
            font-weight: 800;
            color: var(--gold);
            margin: 5px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .tap-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin: 20px 0;
        }

        .coin-btn {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, #2b2b2b 0%, #111111 100%);
            border: 4px solid var(--gold);
            box-shadow: 0 0 30px rgba(243, 186, 47, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.05s ease;
        }

        .coin-btn:active {
            transform: scale(0.95);
        }

        .coin-img {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            pointer-events: none;
        }

        .energy-box {
            width: 100%;
            max-width: 320px;
            text-align: center;
            margin-bottom: 15px;
        }

        .energy-text {
            font-size: 16px;
            font-weight: bold;
            color: var(--gold);
            margin-bottom: 8px;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: #1e2022;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .progress-fill {
            height: 100%;
            width: 100%;
            background: var(--gold-gradient);
            transition: width 0.2s;
        }

        .btn {
            width: 100%;
            max-width: 320px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            background: var(--gold-gradient);
            color: #000;
            box-shadow: 0 4px 15px rgba(243, 186, 47, 0.2);
            margin-top: 10px;
        }

        .btn:disabled {
            background: #2c3540 !important;
            color: #6c757d !important;
            box-shadow: none;
            cursor: not-allowed;
        }

        .btn-sm {
            padding: 8px 12px;
            font-size: 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            color: #fff;
        }

        .btn-approve { background: var(--green); }
        .btn-reject { background: var(--red); }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            font-size: 12px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 14px;
            background: #111418;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: var(--gold);
        }

        .navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #121418;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
        }

        .nav-item {
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }

        .nav-item.active {
            color: var(--gold);
        }

        .screen { display: none; width: 100%; }
        .screen.active { display: flex; flex-direction: column; align-items: center; }

        /* Admin Table Styles */
        .admin-table {
            width: 100%;
            max-width: 500px;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 13px;
        }

        .admin-table th, .admin-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .admin-table th {
            color: var(--gold);
            background: #111418;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- HOME SCREEN -->
        <div id="home-screen" class="screen active">
            <div class="balance-header">
                <div class="balance-title">BALANCE</div>
                <div class="balance-amount">
                    ⚡ <span id="balance-val">0</span>
                </div>
            </div>

            <div class="tap-area">
                <div class="coin-btn" id="coin-btn" onclick="handleTap()">
                    <img src="assets/bonk.png" alt="BONK" class="coin-img" onerror="this.src='https://cryptologos.cc/logos/bonk1-bonk-logo.png'">
                </div>
            </div>

            <div class="energy-box">
                <div class="energy-text">⚡ <span id="xp-val">300</span> / 300</div>
                <div class="progress-bar">
                    <div id="xp-fill" class="progress-fill" style="width: 100%;"></div>
                </div>
            </div>

            <button id="ad-btn" class="btn" onclick="watchAdRefill()" disabled>
                Watch Ads & Full Energy
            </button>
        </div>

        <!-- WITHDRAW SCREEN -->
        <div id="withdraw-screen" class="screen">
            <div class="balance-header" style="margin-bottom: 20px;">
                <div class="balance-title">WITHDRAW BALANCE</div>
                <div class="balance-amount">
                    <span id="withdraw-balance-val">0</span> BONK
                </div>
            </div>

            <div class="card">
                <div class="input-group">
                    <label>Binance Pay ID / User ID</label>
                    <input type="text" id="binance-id" placeholder="Enter your Binance ID">
                </div>

                <div class="input-group">
                    <label>Amount (Min: 1,000 BONK)</label>
                    <input type="number" id="withdraw-amount" placeholder="Min 1000">
                </div>

                <button class="btn" onclick="submitWithdrawal()">Withdraw Now</button>
            </div>
        </div>

        <!-- ADMIN PANEL SCREEN -->
        <div id="admin-screen" class="screen">
            <div class="balance-header">
                <div class="balance-title">ADMIN DASHBOARD</div>
                <div class="balance-amount" style="font-size: 24px;">Withdrawal Requests</div>
            </div>

            <button class="btn" style="width: auto; padding: 8px 16px; margin-bottom: 15px;" onclick="fetchWithdrawals()">🔄 Refresh Requests</button>

            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Binance ID</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="withdrawal-list">
                    <tr><td colspan="4" style="text-align:center;">Loading requests...</td></tr>
                </tbody>
            </table>
        </div>

    </div>

    <!-- NAVBAR -->
    <div class="navbar" id="main-navbar">
        <div class="nav-item active" id="nav-home" onclick="switchScreen('home-screen', 'nav-home')">HOME</div>
        <div class="nav-item" id="nav-withdraw" onclick="switchScreen('withdraw-screen', 'nav-withdraw')">WITHDRAW</div>
        <div class="nav-item" id="nav-admin" style="display:none;" onclick="switchScreen('admin-screen', 'nav-admin')">ADMIN</div>
    </div>

    <script>
        const ADSTERRA_LINK = "https://www.profitableratecpmnetwork.com/mag701y1?key=e6dcf81d34580abdf64766ac0be7e76d";
        const BACKEND_URL = "https://pepe-backend-wkym.onrender.com";
        
        let balance = parseInt(localStorage.getItem('bonk_balance'));
        if (isNaN(balance)) balance = 0;

        let xp = parseInt(localStorage.getItem('bonk_xp'));
        if (isNaN(xp)) xp = 300;

        let adStartTime = 0;

        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        function updateUI() {
            document.getElementById('balance-val').innerText = balance.toLocaleString();
            document.getElementById('withdraw-balance-val').innerText = balance.toLocaleString();
            document.getElementById('xp-val').innerText = xp;
            
            let fillPercentage = Math.max(0, Math.min(100, (xp / 300) * 100));
            document.getElementById('xp-fill').style.width = fillPercentage + '%';

            const adBtn = document.getElementById('ad-btn');
            if (xp <= 0) {
                adBtn.disabled = false;
            } else {
                adBtn.disabled = true;
            }
        }

        function handleTap() {
            if (xp >= 10) {
                balance += 1;
                xp -= 10;
                
                localStorage.setItem('bonk_balance', balance);
                localStorage.setItem('bonk_xp', xp);
                
                updateUI();
            } else {
                alert("Out of Energy! Watch Ad to refill.");
            }
        }

        function watchAdRefill() {
            if (xp > 0) return;

            adStartTime = Date.now();

            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openLink) {
                window.Telegram.WebApp.openLink(ADSTERRA_LINK);
            } else {
                const a = document.createElement('a');
                a.href = ADSTERRA_LINK;
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }

            const checkFocus = () => {
                const duration = (Date.now() - adStartTime) / 1000;
                if (duration >= 5) {
                    xp = 300;
                    localStorage.setItem('bonk_xp', xp);
                    updateUI();
                    alert("⚡ Energy Refilled to 300 XP!");
                } else {
                    alert("⚠️ You must watch ad for at least 5 seconds to refill energy!");
                }
                window.removeEventListener('focus', checkFocus);
            };

            window.addEventListener('focus', checkFocus);
        }

        function switchScreen(screenId, navId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            document.getElementById(screenId).classList.add('active');
            if (document.getElementById(navId)) {
                document.getElementById(navId).classList.add('active');
            }
            
            if (screenId === 'admin-screen') {
                fetchWithdrawals();
            } else {
                updateUI();
            }
        }

        function submitWithdrawal() {
            const binanceId = document.getElementById('binance-id').value.trim();
            const amount = parseInt(document.getElementById('withdraw-amount').value);

            if (!binanceId) {
                alert("Please enter your Binance ID!");
                return;
            }
            if (!amount || amount < 1000) {
                alert("Minimum withdrawal is 1,000 BONK!");
                return;
            }
            if (amount > balance) {
                alert("Insufficient BONK balance!");
                return;
            }

            fetch(`${BACKEND_URL}/api/withdraw`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ binanceId, amount })
            })
            .then(res => res.json())
            .then(() => {
                balance -= amount;
                localStorage.setItem('bonk_balance', balance);
                updateUI();
                alert("✅ Withdrawal Request Submitted!");
                document.getElementById('binance-id').value = '';
                document.getElementById('withdraw-amount').value = '';
            })
            .catch(() => alert("Error connecting to server."));
        }

        // --- ADMIN PANEL FUNCTIONS ---
        function fetchWithdrawals() {
            const listElement = document.getElementById('withdrawal-list');
            listElement.innerHTML = `<tr><td colspan="4" style="text-align:center;">Loading...</td></tr>`;

            fetch(`${BACKEND_URL}/api/admin/withdrawals`)
            .then(res => res.json())
            .then(data => {
                if (!data || data.length === 0) {
                    listElement.innerHTML = `<tr><td colspan="4" style="text-align:center;">No pending requests found.</td></tr>`;
                    return;
                }

                let rowsHtml = '';
                data.forEach(item => {
                    rowsHtml += `
                        <tr>
                            <td>${item.binanceId}</td>
                            <td>${item.amount} BONK</td>
                            <td>${item.status || 'Pending'}</td>
                            <td>
                                <button class="btn-sm btn-approve" onclick="updateStatus('${item._id || item.id}', 'Approved')">✓</button>
                                <button class="btn-sm btn-reject" onclick="updateStatus('${item._id || item.id}', 'Rejected')">✗</button>
                            </td>
                        </tr>
                    `;
                });
                listElement.innerHTML = rowsHtml;
            })
            .catch(err => {
                listElement.innerHTML = `<tr><td colspan="4" style="text-align:center; color: red;">Failed to load data from backend.</td></tr>`;
            });
        }

        function updateStatus(id, newStatus) {
            fetch(`${BACKEND_URL}/api/admin/withdrawals/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            })
            .then(res => res.json())
            .then(() => {
                alert(`Status updated to ${newStatus}`);
                fetchWithdrawals();
            })
            .catch(() => alert("Failed to update status"));
        }

        // Check URL Parameters on Load
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const isAdmin = urlParams.get('admin') === 'true' || window.location.hash === '#admin';

            if (isAdmin) {
                document.getElementById('nav-admin').style.display = 'block';
                switchScreen('admin-screen', 'nav-admin');
            } else {
                updateUI();
            }
        });
    </script>
</body>
</html>
